name: review-code
description: 実装差分のコードレビューとクロスレビュー
max_steps: 10
initial_step: review

workflow_config:
  provider_options:
    copilot:
      network_access: true

personas:
  custom-reviewer: ../facets/personas/custom-reviewer.md
  custom-supervisor: ../facets/personas/custom-supervisor.md
policies:
  design: ../facets/policies/design.md
  coding: ../facets/policies/coding.md
  validation: ../facets/policies/validation.md
knowledge:
  tier-assessment: ../facets/knowledge/tier-assessment.md

steps:
  - name: review
    persona: custom-reviewer
    policy: [design, coding]
    edit: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Bash]
    output_contracts:
      report:
        - name: 00-review.md
          format: ai-review
    instruction: |
      コードレビューを実施してください。
      1. git diff で実装差分を確認する（差分がない場合は git show HEAD でコミット内容を確認）
      2. 関連ファイルを読み込み、変更の文脈を理解する
      3. レビュー方針に基づいてレビュー結果をレポートに出力する
      Task: {task}
    rules:
      - condition: レビュー完了
        next: cross-review
      - condition: レビュー対象が存在しない
        next: ABORT

  - name: cross-review
    parallel:
      - name: claude-meta-review
        persona: custom-reviewer
        policy: [design, coding]
        edit: false
        provider_options:
          claude:
            allowed_tools: [Read, Glob, Grep]
        output_contracts:
          report:
            - name: 01-claude-meta-review.md
              format: ai-review
        instruction: |
          レビュー結果の妥当性を検証してください。
          過剰な指摘や見落としがないか確認してください。
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
      - name: copilot-meta-review
        persona: custom-reviewer
        policy: [design, coding]
        provider: copilot
        model: gpt-5.3-codex
        edit: false
        output_contracts:
          report:
            - name: 02-copilot-meta-review.md
              format: ai-review
        instruction: |
          レビュー結果の妥当性を検証してください。
          指摘の優先度と実用性を評価してください。
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved")
        next: supervise
      - condition: any("needs_fix")
        next: fix-review

  - name: fix-review
    persona: custom-reviewer
    policy: [design, coding]
    edit: false
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep]
    output_contracts:
      report:
        - name: 00-review.md
          format: ai-review
    instruction: |
      クロスレビューの指摘を基にレビュー内容を改善してください。
      コード修正は行わず、レビューレポートの改善のみ行ってください。
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: レビュー改善完了
        next: cross-review
      - condition: 改善不要
        next: supervise

  - name: supervise
    persona: custom-supervisor
    policy: validation
    knowledge: tier-assessment
    edit: false
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep]
    output_contracts:
      report:
        - name: 03-validation.md
          format: supervisor-validation
        - name: 04-summary.md
          format: summary
    instruction: |
      レビュー結果の最終検証を行ってください。
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: 承認
        next: COMPLETE
      - condition: 差し戻し
        next: review

loop_monitors:
  - cycle:
      - cross-review
      - fix-review
    threshold: 3
    judge:
      persona: custom-supervisor
      instruction: |
        レビュー改善サイクルが {cycle_count} 回繰り返されています。

        **参照するレポート:**
        - Claude メタレビュー: {report:01-claude-meta-review.md}
        - Copilot メタレビュー: {report:02-copilot-meta-review.md}

        進捗があるか判断してください。
      rules:
        - condition: 進捗あり
          next: cross-review
        - condition: 非生産的
          next: supervise
