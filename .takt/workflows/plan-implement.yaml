name: plan-implement
description: 設計から TDD 実装までの一気通貫ワークフロー
max_steps: 30
initial_step: design

workflow_config:
  provider_options:
    copilot:
      network_access: true

personas:
  custom-planner: ../facets/personas/custom-planner.md
  custom-coder: ../facets/personas/custom-coder.md
  custom-reviewer: ../facets/personas/custom-reviewer.md
  custom-supervisor: ../facets/personas/custom-supervisor.md
policies:
  design: ../facets/policies/design.md
  coding: ../facets/policies/coding.md
  validation: ../facets/policies/validation.md
knowledge:
  tdd: ../facets/knowledge/tdd.md
  tier-assessment: ../facets/knowledge/tier-assessment.md

steps:
  # === Plan phase ===
  - name: design
    persona: custom-planner
    policy: design
    edit: true
    required_permission_mode: edit
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Write, Edit, WebSearch, WebFetch]
    output_contracts:
      report:
        - name: 00-plan.md
          format: plan
    instruction: |
      以下のタスクについて設計を行ってください。
      1. プロジェクトの関連ファイルを読み込み、現状の設計を把握する
      2. 設計方針に基づいて設計案を作成する
      3. 設計案の本文（成果物の正本）を {report_dir}/plan-document.md に Write ツールで書き出す
         - 1行目は「# Plan: <タスク名>」の見出しにする
         - 本文に「## 」セクションを1つ以上含める
         - 最終行は「<!-- END OF PLAN -->」のみとする
         - 全体を 131072 バイト以内に収める（超過すると quality gate で差し戻される）
         - このファイル以外のファイルを作成・変更してはならない（プロジェクトのソースは読み取りのみ）
         - 要件が不明確で ABORT する場合も、不明点を記録した plan-document.md を同じ形式で書き出すこと
      4. quality gate 失敗で再実行された場合は、Previous Response の「Output log」のパスを Read して
         失敗理由を確認してから修正する（失敗メッセージ本文は Previous Response に含まれない）
      応答本文には設計の要約のみを記載し、プラン全文を再掲しないこと。
      Task: {task}
    # 成果物欠損の機械検証。応答分割等でプラン本文が壊れた場合にステップを再実行させる
    # （plan.yaml の design / fix の quality_gates と同期すること）
    quality_gates:
      - type: command
        name: plan-document-complete
        command: |
          set -eu
          metas=$(grep -lE '"status": *"running"' .takt/runs/*/meta.json) || { echo "no running run meta found"; exit 1; }
          [ "$(printf '%s\n' "$metas" | wc -l)" -eq 1 ] || { echo "expected exactly 1 running run: $metas"; exit 1; }
          dir=$(sed -n 's/.*"reportDirectory": *"\([^"]*\)".*/\1/p' "$metas")
          f="$dir/plan-document.md"
          [ -f "$f" ] || { echo "missing plan document: $f"; exit 1; }
          head -n 1 "$f" | grep -q '^# ' || { echo "first line must be '# ' heading: $f"; exit 1; }
          grep -q '^## ' "$f" || { echo "no '## ' section found: $f"; exit 1; }
          tail -n 1 "$f" | grep -qx '<!-- END OF PLAN -->' || { echo "missing end marker: $f"; exit 1; }
          size=$(wc -c < "$f")
          [ "$size" -ge 1000 ] || { echo "plan document too small ($size bytes): $f"; exit 1; }
          [ "$size" -le 131072 ] || { echo "plan document too large ($size bytes, limit 131072): $f"; exit 1; }
    rules:
      - condition: 設計案が作成された
        next: review-design
      - condition: 要件が不明確で設計できない
        next: ABORT

  - name: review-design
    parallel:
      - name: claude-review-design
        persona: custom-reviewer
        policy: [design, coding]
        edit: false
        provider_options:
          claude:
            allowed_tools: [Read, Glob, Grep]
        output_contracts:
          report:
            - name: 01-plan-review-claude.md
              format: ai-review
        instruction: |
          設計案をレビューしてください。
          設計案の本文: {report_dir}/plan-document.md を読んで全文を確認すること。
          観点: アーキテクチャ、変更容易性、DDD整合性
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
      - name: copilot-review-design
        persona: custom-reviewer
        policy: [design, coding]
        provider: copilot
        model: gpt-5.5
        edit: false
        output_contracts:
          report:
            - name: 02-plan-review-copilot.md
              format: ai-review
        instruction: |
          設計案をレビューしてください。
          設計案の本文: {report_dir}/plan-document.md を読んで全文を確認すること。
          観点: 実装可能性、セキュリティ、パフォーマンス
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved")
        next: approve-design
      - condition: any("needs_fix")
        next: fix-design

  - name: fix-design
    persona: custom-planner
    policy: design
    edit: true
    required_permission_mode: edit
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
    output_contracts:
      report:
        - name: 00-plan.md
          format: plan
    instruction: |
      クロスレビューの指摘を検討し、妥当な指摘に対して設計案を改善してください。
      1. レポートディレクトリ {report_dir} 内のレビュー結果（01-plan-review-claude.md, 02-plan-review-copilot.md）を読む
      2. {report_dir}/plan-document.md を Read し、妥当な指摘の該当箇所だけを Edit ツールで差分修正する
         - 全文の書き直しは禁止。既存ファイルへの部分編集のみ行う
         - 例外: plan-document.md が存在しない・破損している場合のみ、00-plan.md とレビュー結果と
           プロジェクトの読解に基づき Write ツールで全文を再作成する（復旧不能ループの防止）
         - 修正後の全体を 131072 バイト以内に収める。編集後に `wc -c` で実サイズを確認すること
           （このステップにはゲート失敗の理由が渡らないため、自己検証が収束の唯一の担保）
         - 上限を超える場合に限り、重複記述の統合と冗長な引用の削除による圧縮を行う。
           この圧縮に限り「部分編集のみ」の制約を超える書き換えを許可する（非収束ループの防止）
         - 先頭の「# Plan:」見出しと最終行の「<!-- END OF PLAN -->」を維持する
         - このファイル以外のファイルを作成・変更してはならない
      3. 応答本文には修正内容の要約のみを記載する（プラン全文を応答に再掲しない）
    # 成果物欠損の機械検証。応答分割等でプラン本文が壊れた場合にステップを再実行させる
    # （plan.yaml の design / fix の quality_gates と同期すること）
    quality_gates:
      - type: command
        name: plan-document-complete
        command: |
          set -eu
          metas=$(grep -lE '"status": *"running"' .takt/runs/*/meta.json) || { echo "no running run meta found"; exit 1; }
          [ "$(printf '%s\n' "$metas" | wc -l)" -eq 1 ] || { echo "expected exactly 1 running run: $metas"; exit 1; }
          dir=$(sed -n 's/.*"reportDirectory": *"\([^"]*\)".*/\1/p' "$metas")
          f="$dir/plan-document.md"
          [ -f "$f" ] || { echo "missing plan document: $f"; exit 1; }
          head -n 1 "$f" | grep -q '^# ' || { echo "first line must be '# ' heading: $f"; exit 1; }
          grep -q '^## ' "$f" || { echo "no '## ' section found: $f"; exit 1; }
          tail -n 1 "$f" | grep -qx '<!-- END OF PLAN -->' || { echo "missing end marker: $f"; exit 1; }
          size=$(wc -c < "$f")
          [ "$size" -ge 1000 ] || { echo "plan document too small ($size bytes): $f"; exit 1; }
          [ "$size" -le 131072 ] || { echo "plan document too large ($size bytes, limit 131072): $f"; exit 1; }
    rules:
      - condition: 修正完了
        next: review-design
      - condition: 指摘は設計意図通りで修正不要
        next: approve-design

  - name: approve-design
    persona: custom-supervisor
    policy: validation
    knowledge: tier-assessment
    edit: false
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep]
    output_contracts:
      report:
        - name: 03-plan-validation.md
          format: supervisor-validation
    instruction: |
      設計の最終検証を行ってください。
      1. 設計案本文（成果物の正本） {report_dir}/plan-document.md を確認する
         - Read の offset/limit や Grep で冒頭・末尾・見出し構造を確認する（全文を一度に読む必要はない）
         - ファイルが欠損している、先頭が「# Plan:」見出しでない、最終行が「<!-- END OF PLAN -->」でない場合は
           成果物欠損として差し戻すこと
      2. レポートディレクトリ {report_dir} 内のレビュー結果と 00-plan.md（補助のタスク計画サマリ）を確認する
    rules:
      - condition: 承認
        next: implement
      - condition: 差し戻し
        next: design
      - condition: 成果物欠損
        next: design

  # === Implement phase ===
  - name: implement
    persona: custom-coder
    policy: [design, coding]
    knowledge: tdd
    edit: true
    required_permission_mode: edit
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, WebSearch, WebFetch]
    output_contracts:
      report:
        - name: 10-impl-scope.md
          format: coder-scope
        - name: 11-impl-decisions.md
          format: coder-decisions
    instruction: |
      設計案に基づいて TDD で実装してください。
      1. レポートディレクトリ {report_dir} 内の設計案本文（plan-document.md）とタスク計画（00-plan.md）を参照し、変更スコープとインターフェースを把握する
      2. テストを先に書く（Red）
         - テストを実行し、追加したテストが FAIL することを確認してから次へ進む
      3. テストを通す最小限の実装（Green）
         - テストを実行し、全件 PASS を確認してから次へ進む
      4. リファクタリング（Refactor）
         - テストを実行し、全件 PASS が維持されていることを確認する
      各フェーズでテスト実行結果（件数・PASS/FAIL）を明示すること。
      Task: {task}
    rules:
      - condition: 実装完了、全テストパス
        next: review-impl
      - condition: 実装方針に不明点がある
        next: ABORT

  - name: review-impl
    parallel:
      - name: claude-review-impl
        persona: custom-reviewer
        policy: [design, coding]
        edit: false
        provider_options:
          claude:
            allowed_tools: [Read, Glob, Grep]
        output_contracts:
          report:
            - name: 12-impl-review-claude.md
              format: ai-review
        instruction: |
          実装差分をレビューしてください。
          観点: 設計整合性、変更容易性、テスト網羅性
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
      - name: copilot-review-impl
        persona: custom-reviewer
        policy: [design, coding]
        provider: copilot
        model: gpt-5.5
        edit: false
        output_contracts:
          report:
            - name: 13-impl-review-copilot.md
              format: ai-review
        instruction: |
          実装差分をレビューしてください。
          観点: セキュリティ、パフォーマンス、エッジケース
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved")
        next: supervise
      - condition: any("needs_fix")
        next: fix-impl

  - name: fix-impl
    persona: custom-coder
    policy: [design, coding]
    knowledge: tdd
    edit: true
    required_permission_mode: edit
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
    output_contracts:
      report:
        - name: 10-impl-scope.md
          format: coder-scope
        - name: 11-impl-decisions.md
          format: coder-decisions
    instruction: |
      クロスレビューの指摘を検討し、妥当な指摘に対して修正してください。
      レポートディレクトリ {report_dir} 内のレビュー結果を参照してください。
      修正後はテストが通ることを確認してください。
    rules:
      - condition: 修正完了、全テストパス
        next: review-impl
      - condition: 指摘は実装意図通りで修正不要
        next: supervise

  - name: supervise
    persona: custom-supervisor
    policy: validation
    knowledge: tier-assessment
    edit: true
    required_permission_mode: edit
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Bash]
    output_contracts:
      report:
        - name: 14-impl-validation.md
          format: supervisor-validation
        - name: 15-summary.md
          format: summary
    instruction: |
      実装の最終検証を行ってください。
      1. 全テストが通ることを確認（テスト実行）
      2. Linter/Formatter を実行
      3. 承認する場合は適切な粒度で git add && git commit
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: 承認・コミット完了
        next: COMPLETE
      - condition: 差し戻し
        next: implement

loop_monitors:
  - cycle:
      - review-design
      - fix-design
    threshold: 3
    judge:
      persona: custom-supervisor
      instruction: |
        review-design と fix-design のサイクルが {cycle_count} 回繰り返されています。

        **参照するレポート:**
        - Claude レビュー: {report:01-plan-review-claude.md}
        - Copilot レビュー: {report:02-plan-review-copilot.md}

        進捗があるか、同じ指摘が繰り返されているか判断してください。
      rules:
        - condition: 進捗あり
          next: review-design
        - condition: 非生産的
          next: approve-design
  - cycle:
      - review-impl
      - fix-impl
    threshold: 3
    judge:
      persona: custom-supervisor
      instruction: |
        review-impl と fix-impl のサイクルが {cycle_count} 回繰り返されています。

        **参照するレポート:**
        - Claude レビュー: {report:12-impl-review-claude.md}
        - Copilot レビュー: {report:13-impl-review-copilot.md}

        進捗があるか判断してください。
      rules:
        - condition: 進捗あり
          next: review-impl
        - condition: 非生産的
          next: supervise
