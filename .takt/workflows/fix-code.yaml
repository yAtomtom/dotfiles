name: fix-code
description: レビュー指摘に基づくコード修正
max_steps: 20
initial_step: fix

workflow_config:
  provider_options:
    copilot:
      network_access: true

personas:
  custom-coder: ../facets/personas/custom-coder.md
  custom-reviewer: ../facets/personas/custom-reviewer.md
  custom-supervisor: ../facets/personas/custom-supervisor.md
policies:
  design: ../facets/policies/design.md
  coding: ../facets/policies/coding.md
  validation: ../facets/policies/validation.md
knowledge:
  output-volume: ../facets/knowledge/output-volume.md
  tdd: ../facets/knowledge/tdd.md
  tier-assessment: ../facets/knowledge/tier-assessment.md

steps:
  - name: fix
    persona: custom-coder
    policy: [design, coding]
    knowledge: [output-volume, tdd]
    edit: true
    required_permission_mode: edit
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Edit, Write, Bash, WebSearch, WebFetch]
    output_contracts:
      report:
        - name: 00-scope.md
          format: coder-scope
        - name: 01-decisions.md
          format: coder-decisions
    instruction: |
      レビュー指摘に基づいてコードを修正してください。
      1. レビューファイルの指摘内容を確認する
      2. 妥当な指摘に対して TDD で修正する
      3. 全テストが通ることを確認する
      Task: {task}
    rules:
      - condition: 修正完了、全テストパス
        next: cross-review
      - condition: 修正方針に不明点がある
        next: ABORT

  - name: cross-review
    parallel:
      - name: claude-review
        persona: custom-reviewer
        policy: [design, coding]
        knowledge: output-volume
        edit: false
        provider_options:
          claude:
            allowed_tools: [Read, Glob, Grep]
        output_contracts:
          report:
            - name: 02-claude-review.md
              format: ai-review
        instruction: |
          修正差分をレビューしてください。
          観点: レビュー指摘への対応の妥当性、変更容易性
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
      - name: copilot-review
        persona: custom-reviewer
        policy: [design, coding]
        knowledge: output-volume
        provider: copilot
        model: gpt-5.5
        edit: false
        output_contracts:
          report:
            - name: 03-copilot-review.md
              format: ai-review
        instruction: |
          修正差分をレビューしてください。
          観点: セキュリティ、パフォーマンス、エッジケース
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved")
        next: supervise
      - condition: any("needs_fix")
        next: fix-again

  - name: fix-again
    persona: custom-coder
    policy: [design, coding]
    knowledge: [output-volume, tdd]
    edit: true
    required_permission_mode: edit
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Edit, Write, Bash]
    output_contracts:
      report:
        - name: 00-scope.md
          format: coder-scope
        - name: 01-decisions.md
          format: coder-decisions
    instruction: |
      クロスレビューの指摘を検討し、妥当な指摘に対して修正してください。
      レポートディレクトリ {report_dir} 内のレビュー結果を参照してください。
      修正後はテストが通ることを確認してください。
    rules:
      - condition: 修正完了
        next: cross-review
      - condition: 修正不要
        next: supervise

  - name: supervise
    persona: custom-supervisor
    policy: validation
    knowledge: [output-volume, tier-assessment]
    edit: true
    required_permission_mode: edit
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Bash]
    output_contracts:
      report:
        - name: 04-validation.md
          format: supervisor-validation
        - name: 05-summary.md
          format: summary
    instruction: |
      修正の最終検証を行ってください。
      1. 全テストが通ることを確認
      2. Linter/Formatter を実行
      3. 承認する場合は適切な粒度で git add && git commit
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: 承認・コミット完了
        next: COMPLETE
      - condition: 差し戻し
        next: fix

loop_monitors:
  - cycle:
      - cross-review
      - fix-again
    threshold: 3
    judge:
      persona: custom-supervisor
      instruction: |
        修正サイクルが {cycle_count} 回繰り返されています。

        **参照するレポート:**
        - Claude レビュー: {report:02-claude-review.md}
        - Copilot レビュー: {report:03-copilot-review.md}

        進捗があるか判断してください。
      rules:
        - condition: 進捗あり
          next: cross-review
        - condition: 非生産的
          next: supervise
