name: review-pr
description: GitHub PR の差分レビュー
max_steps: 10
initial_step: review-pr

workflow_config:
  provider_options:
    copilot:
      network_access: true

personas:
  custom-reviewer: ../facets/personas/custom-reviewer.md
  custom-supervisor: ../facets/personas/custom-supervisor.md
policies:
  design: ../facets/policies/design.md
  coding: ../facets/policies/coding.md
  validation: ../facets/policies/validation.md
knowledge:
  output-volume: ../facets/knowledge/output-volume.md
  tier-assessment: ../facets/knowledge/tier-assessment.md

steps:
  - name: review-pr
    persona: custom-reviewer
    policy: [design, coding]
    knowledge: output-volume
    edit: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep, Bash]
    output_contracts:
      report:
        - name: 00-pr-review.md
          format: ai-review
    instruction: |
      GitHub PR をレビューしてください。
      1. gh pr view でPRの概要を確認する
      2. gh pr diff でPRの変更差分を確認する
      3. 関連ファイルを読み込み、変更の文脈を理解する
      4. レビュー結果をレポートに出力する
      Task: {task}
    rules:
      - condition: レビュー完了
        next: cross-review
      - condition: PR が見つからない
        next: ABORT

  - name: cross-review
    parallel:
      - name: claude-meta-review
        persona: custom-reviewer
        policy: [design, coding]
        knowledge: output-volume
        edit: false
        provider_options:
          claude:
            allowed_tools: [Read, Glob, Grep]
        output_contracts:
          report:
            - name: 01-claude-meta-review.md
              format: ai-review
        instruction: |
          レビュー結果の妥当性を検証してください。
          過剰な指摘や見落としがないか確認してください。
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
      - name: copilot-meta-review
        persona: custom-reviewer
        policy: [design, coding]
        knowledge: output-volume
        provider: copilot
        model: gpt-5.5
        edit: false
        required_permission_mode: full
        output_contracts:
          report:
            - name: 02-copilot-meta-review.md
              format: ai-review
        instruction: |
          レビュー結果の妥当性を検証してください。
          指摘の優先度と実用性を評価してください。
          {previous_response}
        rules:
          - condition: approved
          - condition: needs_fix
    rules:
      - condition: all("approved")
        next: supervise
      - condition: any("needs_fix")
        next: fix-review

  - name: fix-review
    persona: custom-reviewer
    policy: [design, coding]
    knowledge: output-volume
    edit: false
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep]
    output_contracts:
      report:
        - name: 00-pr-review.md
          format: ai-review
    instruction: |
      クロスレビューの指摘を基にレビュー内容を改善してください。
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: 改善完了
        next: cross-review
      - condition: 改善不要
        next: supervise

  - name: supervise
    persona: custom-supervisor
    policy: validation
    knowledge: [output-volume, tier-assessment]
    edit: false
    session: refresh
    pass_previous_response: false
    provider_options:
      claude:
        allowed_tools: [Read, Glob, Grep]
    output_contracts:
      report:
        - name: 03-validation.md
          format: supervisor-validation
        - name: 04-summary.md
          format: summary
    instruction: |
      レビュー結果の最終検証を行ってください。
      レポートディレクトリ {report_dir} を参照してください。
    rules:
      - condition: 承認
        next: COMPLETE
      - condition: 差し戻し
        next: review-pr

loop_monitors:
  - cycle:
      - cross-review
      - fix-review
    threshold: 3
    judge:
      persona: custom-supervisor
      instruction: |
        レビュー改善サイクルが {cycle_count} 回繰り返されています。

        **参照するレポート:**
        - Claude メタレビュー: {report:01-claude-meta-review.md}
        - Copilot メタレビュー: {report:02-copilot-meta-review.md}

        進捗があるか判断してください。
      rules:
        - condition: 進捗あり
          next: cross-review
        - condition: 非生産的
          next: supervise
