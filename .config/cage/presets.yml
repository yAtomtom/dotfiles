# cage presets - Claude Code / Copilot CLI / takt サンドボックス設定
# 原則: ファイルシステム書き込みのみ制限（読み取り・ネットワーク・プロセスは制限対象外）

presets:
  # macOS一時ファイル・ターミナルI/O
  tmp:
    allow:
      - path: "/tmp"
        eval-symlinks: true  # macOS: /tmp -> /private/tmp
      - "/dev/tty"

  # Ruby実行環境 (bundle exec rubocop, rspec等のキャッシュ書き込み)
  ruby:
    allow:
      - "$HOME/.bundle"
      - "$HOME/.gem"
      - "$HOME/.rbenv"
      - "$HOME/.cache/rubocop_cache"

  # プロジェクトディレクトリ + git操作
  project:
    allow:
      - "."
    allow-git: true

  # Claude Code固有
  claude-code:
    allow:
      - "$HOME/.claude"
      - "$HOME/.claude.json"
      - "$HOME/.claude.json.backup"
      - "$HOME/.claude.json.lock"
      - "$HOME/.claude.lock"
      - "$HOME/.npm"             # npx キャッシュ用
      - "$HOME/.cache/uv"
      - "$HOME/.local/share/uv"
      - "$HOME/claude-sandbox"
      - "$HOME/github.com/yAtomtom/claude-notes"  # ~/.claude/notes の symlink 先
    allow-keychain: true

  # プロジェクト対応 dotfiles リポジトリ (env var は claude()/copilot_base()/takt() が設定)
  dotfiles-repo:
    allow:
      - "$CAGE_DOTFILES_DIR"

  # Copilot CLI固有
  copilot-cli:
    allow:
      - "$HOME/.config/github-copilot"
      - "$HOME/.copilot"
      - "$HOME/.npm"             # npx キャッシュ用
      - "$HOME/.cache/uv"
      - "$HOME/.local/share/uv"
      - "$HOME/.serena"
      - "$HOME/copilot-sandbox"
    allow-keychain: true

  # takt CLI固有 (TAKT Agent Koordination Topology)
  takt-cli:
    allow:
      - "$HOME/.takt"                                      # グローバル設定・ログ・アナリティクス
      - "$HOME/.config/configstore/update-notifier-takt.json"  # npm update-notifier

auto-presets:
  - command: claude
    presets:
      - claude-code
      - project
      - dotfiles-repo
      - tmp
      - ruby

  - command: copilot
    presets:
      - copilot-cli
      - project
      - dotfiles-repo
      - tmp
      - ruby

  - command: takt
    presets:
      - takt-cli
      - claude-code      # 内部で Claude Agent SDK を使用（インプロセス）
      - copilot-cli      # 内部で copilot を child_process.spawn
      - project
      - dotfiles-repo
      - tmp
      - ruby
