# cage presets - Claude Code / Copilot CLI / takt サンドボックス設定
# 原則: ファイルシステム書き込みのみ制限（読み取り・ネットワーク・プロセスは制限対象外）

presets:
  # macOS一時ファイル・ターミナルI/O
  tmp:
    allow:
      - path: "/tmp"
        eval-symlinks: true  # macOS: /tmp -> /private/tmp
      # /dev 配下を全許可: ターミナル/PTY (tty, ptmx, ttysXXX) を一括で許可するため。
      # cage の path 指定は glob/regex 非対応のため個別列挙が現実的でなく、
      # /dev 配下の書き込みは非root では実害が小さい（disk* 等は root 必須）。
      - "/dev"

  # Ruby実行環境 (bundle exec rubocop, rspec等のキャッシュ書き込み)
  ruby:
    allow:
      - "$HOME/.bundle"
      - "$HOME/.gem"
      - "$HOME/.rbenv"
      - "$HOME/.cache/rubocop_cache"

  # Rust実行環境 (cargo test/build のレジストリキャッシュ・toolchain 書き込み)
  rust:
    allow:
      - "$HOME/.cargo"    # registry キャッシュ・git checkout・ダウンロードした crate
      - "$HOME/.rustup"   # toolchain・component の書き込み
      - "/Volumes"        # dmg 生成時のディスクイメージマウント先 (/Volumes/<name>/)

  # プロジェクトディレクトリ + git操作
  project:
    allow:
      - "."
    allow-git: true

  # Claude Code固有
  claude-code:
    allow:
      - "$HOME/.claude"
      - "$HOME/.claude.json"
      - "$HOME/.claude.json.backup"
      - "$HOME/.claude.json.lock"
      - "$HOME/.claude.lock"
      - "$HOME/.claude.json.tmp.*"  # claude 2.1.133+ の atomic write tmp (~/.claude.json.tmp.<pid>.<hash>)
      - "$HOME/Library/Caches/claude-cli-nodejs"  # MCP server ログ出力先 (mcp-logs-<server>/*.jsonl)
      - "$HOME/.npm"             # npx キャッシュ用
      - "$HOME/.cache/uv"
      - "$HOME/.local/share/uv"
      - "$HOME/claude-sandbox"
      - "$HOME/github.com/yAtomtom/claude-notes"  # ~/.claude/notes の symlink 先
      - "$HOME/.copilot"         # クロスレビュー: Claude → Copilot 呼び出し時の書き込み先
      - "$HOME/copilot-sandbox"  # クロスレビュー: Copilot のサンドボックス出力先
    allow-keychain: true

  # プロジェクト対応 dotfiles リポジトリ (env var は claude()/copilot_base()/takt() が設定)
  dotfiles-repo:
    allow:
      - "$CAGE_DOTFILES_DIR"

  # Copilot CLI固有
  copilot-cli:
    allow:
      - "$HOME/.config/github-copilot"
      - "$HOME/.copilot"
      - "$HOME/Library/Caches/copilot"  # SEA 同梱パッケージ展開先 (sea-loader.js が pkg/ を作成)
      - "$HOME/.npm"             # npx キャッシュ用
      - "$HOME/.cache/uv"
      - "$HOME/.local/share/uv"
      - "$HOME/.serena"
      - "$HOME/copilot-sandbox"
    allow-keychain: true

  # takt CLI固有 (TAKT Agent Koordination Topology)
  takt-cli:
    allow:
      - "$HOME/.takt"                                      # グローバル設定・ログ・アナリティクス
      - "$HOME/.config/configstore"  # npm update-notifier (atomically が一時ファイルを同ディレクトリに作成するためディレクトリ単位で許可)

auto-presets:
  - command: claude
    presets:
      - claude-code
      - project
      - dotfiles-repo
      - tmp
      - ruby
      - rust

  - command: copilot
    presets:
      - copilot-cli
      - project
      - dotfiles-repo
      - tmp
      - ruby

  # takt は --provider で動的にエージェントを切替えるため、全プロバイダの権限を常時合成する
  # （引数パースの複雑さを回避するトレードオフ）
  - command: takt
    presets:
      - takt-cli
      - claude-code      # 内部で Claude Agent SDK を使用（インプロセス）
      - copilot-cli      # 内部で copilot を child_process.spawn
      - project
      - dotfiles-repo
      - tmp
      - ruby
